<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            border: 1px solid grey;
            border-collapse: collapse;
        }
        th, td{
            border: 1px solid grey;
            padding: 6px;
        }
    </style>
</head>
<body>
    <div class="maindiv">
        <p id="container"></p>

    </div>
    <script>
        const students = [
            { name: "Alice Johnson", roll: 1, mobile: "123-456-7890", email: "alice.johnson@example.com" },
            { name: "Bob Smith", roll: 2, mobile: "234-567-8901", email: "bob.smith@example.com" },
            { name: "Charlie Brown", roll: 3, mobile: "345-678-9012", email: "charlie.brown@example.com" },
            { name: "Diana Prince", roll: 4, mobile: "456-789-0123", email: "diana.prince@example.com" },
            { name: "Evan Davis", roll: 5, mobile: "567-890-1234", email: "evan.davis@example.com" },
            { name: "Fiona Wilson", roll: 6, mobile: "678-901-2345", email: "fiona.wilson@example.com" },
            { name: "George Moore", roll: 7, mobile: "789-012-3456", email: "george.moore@example.com" },
            { name: "Hannah Taylor", roll: 8, mobile: "890-123-4567", email: "hannah.taylor@example.com" },
            { name: "Ian Anderson", roll: 9, mobile: "901-234-5678", email: "ian.anderson@example.com" },
            { name: "Julia Martinez", roll: 10, mobile: "012-345-6789", email: "julia.martinez@example.com" }
        ];   
        let htmlStr = "<table>";
        htmlStr += "<tr><th>Roll</th><th>Name</th><th>mobile</th><th>email</th></tr>"
        for(let std of students){
            htmlStr += "<tr><td>"+std.roll+"</td><td>"+std.name+"</td><td>"+std.mobile+"</td><td>"+std.email+"</td></tr>"
        }
        htmlStr += "</table>"
        document.getElementById("container").innerHTML = htmlStr
    </script>
</body>
</html>
