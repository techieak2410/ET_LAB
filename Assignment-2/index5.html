<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Experience Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: white;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin-top: 30px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .row-item {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .btn-group-custom {
            margin-top: 20px;
            text-align: center;
        }
        #resultsTable {
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Employee Working Experience</h1>
        
        <form id="experienceForm">
            <div id="experienceContainer">
                <div class="row-item">
                    <div class="form-group">
                        <label>Organization:</label>
                        <input type="text" class="form-control organization" required>
                    </div>
                    <div class="form-group">
                        <label>Designation:</label>
                        <input type="text" class="form-control designation" required>
                    </div>
                    <div class="form-group">
                        <label>Duration:</label>
                        <input type="text" class="form-control duration" placeholder="e.g., 2 years" required>
                    </div>
                </div>
            </div>

            <div class="btn-group-custom">
                <button type="button" class="btn btn-primary" id="addMoreBtn">Add More</button>
                <button type="submit" class="btn btn-success">Submit</button>
            </div>
        </form>

        <div id="resultsTable"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let rowCount = 1;

        document.getElementById('addMoreBtn').addEventListener('click', function() {
            rowCount++;
            const newRow = document.createElement('div');
            newRow.className = 'row-item';
            newRow.innerHTML = `
                <div class="form-group">
                    <label>Organization:</label>
                    <input type="text" class="form-control organization" required>
                </div>
                <div class="form-group">
                    <label>Designation:</label>
                    <input type="text" class="form-control designation" required>
                </div>
                <div class="form-group">
                    <label>Duration:</label>
                    <input type="text" class="form-control duration" placeholder="e.g., 2 years" required>
                </div>
            `;
            document.getElementById('experienceContainer').appendChild(newRow);
        });

        document.getElementById('experienceForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const experiences = [];
            const rows = document.querySelectorAll('.row-item');

            rows.forEach(row => {
                const org = row.querySelector('.organization').value;
                const designation = row.querySelector('.designation').value;
                const duration = row.querySelector('.duration').value;

                if (org && designation && duration) {
                    experiences.push({ org, designation, duration });
                }
            });

            if (experiences.length > 0) {
                displayResults(experiences);
            } else {
                alert('Please fill all fields');
            }
        });

        function displayResults(experiences) {
            let tableHTML = '<h2>Submitted Details</h2><table class="table table-bordered"><thead><tr><th>Organization</th><th>Designation</th><th>Duration</th></tr></thead><tbody>';

            experiences.forEach(exp => {
                tableHTML += `<tr><td>${exp.org}</td><td>${exp.designation}</td><td>${exp.duration}</td></tr>`;
            });

            tableHTML += '</tbody></table>';
            document.getElementById('resultsTable').innerHTML = tableHTML;
        }
    </script>
</body>
</html>
